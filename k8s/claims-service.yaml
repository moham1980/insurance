apiVersion: v1
kind: ConfigMap
metadata:
  name: claims-service-config
  namespace: insurance
data:
  DATABASE_URL: postgresql://insurance:insurance@postgres:5432/insurance
  KAFKA_BROKERS: kafka:9092
  JWT_SECRET: your-jwt-secret-here
  PORT: "3001"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: claims-service
  namespace: insurance
spec:
  replicas: 3
  selector:
    matchLabels:
      app: claims-service
  template:
    metadata:
      labels:
        app: claims-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3001"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: claims-service
        image: insurance/claims-service:latest
        ports:
        - containerPort: 3001
        envFrom:
        - configMapRef:
            name: claims-service-config
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 3001
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: claims-service
  namespace: insurance
spec:
  selector:
    app: claims-service
  ports:
  - port: 3001
    targetPort: 3001
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: claims-service-hpa
  namespace: insurance
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: claims-service
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
