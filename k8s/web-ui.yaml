apiVersion: v1
kind: ConfigMap
metadata:
  name: web-ui-config
  namespace: insurance
data:
  NEXT_PUBLIC_API_URL: http://api-gateway:3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-ui
  namespace: insurance
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web-ui
  template:
    metadata:
      labels:
        app: web-ui
    spec:
      containers:
      - name: web-ui
        image: insurance/web-ui:latest
        ports:
        - containerPort: 3000
        envFrom:
        - configMapRef:
            name: web-ui-config
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: web-ui
  namespace: insurance
spec:
  selector:
    app: web-ui
  ports:
  - port: 3000
    targetPort: 3000
  type: LoadBalancer
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web-ui-ingress
  namespace: insurance
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
  - hosts:
    - insurance.example.com
    secretName: web-ui-tls
  rules:
  - host: insurance.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: web-ui
            port:
              number: 3000
