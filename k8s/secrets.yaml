apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: insurance
type: Opaque
stringData:
  POSTGRES_USER: insurance
  POSTGRES_PASSWORD: insurance
  POSTGRES_DB: insurance
---
apiVersion: v1
kind: Secret
metadata:
  name: jwt-secret
  namespace: insurance
type: Opaque
stringData:
  JWT_SECRET: your-super-secret-jwt-key-change-in-production
---
apiVersion: v1
kind: Secret
metadata:
  name: api-keys
  namespace: insurance
type: Opaque
stringData:
  SANHAB_API_KEY: your-sanhab-api-key
  SMS_API_KEY: your-sms-api-key
