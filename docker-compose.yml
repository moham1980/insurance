x-proxy-build-args: &proxy_build_args
  HTTP_PROXY: http://host.docker.internal:10809
  HTTPS_PROXY: http://host.docker.internal:10809
  http_proxy: http://host.docker.internal:10809
  https_proxy: http://host.docker.internal:10809
  ALL_PROXY: http://host.docker.internal:10809
  all_proxy: http://host.docker.internal:10809
  NO_PROXY: localhost,127.0.0.1,host.docker.internal,insurance-postgres,insurance-kafka
  no_proxy: localhost,127.0.0.1,host.docker.internal,insurance-postgres,insurance-kafka

services:

  insurance-zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    restart: unless-stopped

  insurance-kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - insurance-zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: insurance-zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,EXTERNAL://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://insurance-kafka:9092,EXTERNAL://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9093:9093"
    restart: unless-stopped

  insurance-postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: insurance
      POSTGRES_PASSWORD: insurance123
      POSTGRES_DB: insurance_platform
    ports:
      - "5435:5432"
    volumes:
      - insurance-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "insurance", "-d", "insurance_platform"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  insurance-redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - insurance-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # Migration Jobs (init containers pattern)
  auth-migrate:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
      args: *proxy_build_args
    command: ["bun", "run", "migrate"]
    environment:
      DB_HOST: insurance-postgres
      DB_PORT: 5432
      DB_USERNAME: insurance
      DB_PASSWORD: insurance123
      DB_DATABASE: insurance_platform
      DB_SCHEMA: auth
    depends_on:
      insurance-postgres:
        condition: service_healthy
    profiles:
      - migrate
    restart: "no"

  sales-network-migrate:
