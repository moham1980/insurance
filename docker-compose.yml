  # Application Services
  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
      args: *proxy_build_args
    ports:
      - "18001:18001"
    environment:
      NODE_ENV: production
      PORT: 18001
      DB_HOST: insurance-postgres
      DB_PORT: 5432
      DB_USERNAME: insurance
      DB_PASSWORD: insurance123
      DB_DATABASE: insurance_platform
      DB_SCHEMA: auth
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      SERVICE_TOKEN_ISSUER_KEY: ${SERVICE_TOKEN_ISSUER_KEY:-change-me-in-dev}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      KAFKA_BROKERS: insurance-kafka:9092
      # Ecosystem IAM integration (Phase 1)
      ECOSYSTEM_IAM_ENABLED: ${ECOSYSTEM_IAM_ENABLED:-false}
      ECOSYSTEM_IAM_ISSUER: ${ECOSYSTEM_IAM_ISSUER:-http://localhost:8080}
      ECOSYSTEM_IAM_JWKS_URI: ${ECOSYSTEM_IAM_JWKS_URI:-http://localhost:8080/.well-known/jwks.json}
      ECOSYSTEM_IAM_CLIENT_ID: ${ECOSYSTEM_IAM_CLIENT_ID:-insurance-portal}
      ECOSYSTEM_IAM_CLIENT_SECRET: ${ECOSYSTEM_IAM_CLIENT_SECRET}
      ECOSYSTEM_IAM_AUTH_URL: ${ECOSYSTEM_IAM_AUTH_URL:-http://localhost:8080/oauth2/authorize}
      ECOSYSTEM_IAM_TOKEN_URL: ${ECOSYSTEM_IAM_TOKEN_URL:-http://localhost:8080/oauth2/token}
      ECOSYSTEM_IAM_USERINFO_URL: ${ECOSYSTEM_IAM_USERINFO_URL:-http://localhost:8080/oauth2/userinfo}
      ECOSYSTEM_IAM_SCOPE: ${ECOSYSTEM_IAM_SCOPE:-openid profile email}
      IAM_ISSUER: ${IAM_ISSUER:-http://localhost:8080}
      JWKS_URI: ${JWKS_URI:-http://localhost:8080/.well-known/jwks.json}
      JWT_AUDIENCES: ${JWT_AUDIENCES:-insurance-platform}
    depends_on:
      insurance-postgres:
        condition: service_healthy
      insurance-kafka:
        condition: service_started
    restart: unless-stopped

  partner-gateway:
    build:
