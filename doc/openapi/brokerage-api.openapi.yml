openapi: 3.0.3
info:
  title: Insurance Brokerage API
  version: 1.1.0
  description: OpenAPI contract for brokerage P0 and P1 endpoints (party KYC, broker license, distribution agreement, product management, visibility, broker offerings, catalog BFF).
servers:
  - url: http://localhost:18000/api/v1
paths:
  # ---- P0 Endpoints ----
  /party-kyc/parties:
    post:
      summary: Create a party
      operationId: createParty
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartyCreateRequest'
      responses:
        '200':
          description: Party created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
  /party-kyc/broker-licenses/{licenseId}/validate:
    post:
      summary: Validate a broker license
      operationId: validateBrokerLicense
      parameters:
        - name: licenseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: License validation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
  /sales-network/distribution-agreements:
    post:
      summary: Create a distribution agreement
      operationId: createDistributionAgreement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DistributionAgreementCreateRequest'
      responses:
        '200':
          description: Agreement created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
    get:
      summary: List distribution agreements
      operationId: listDistributionAgreements
      parameters:
        - name: status
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: List of agreements
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
  /sales-network/distribution-agreements/{agreementId}:
    get:
      summary: Get a distribution agreement
      operationId: getDistributionAgreement
      parameters:
        - name: agreementId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Agreement details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
  /sales-network/distribution-agreements/{agreementId}/versions:
    post:
      summary: Create a new agreement version
      operationId: createAgreementVersion
      parameters:
        - name: agreementId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgreementVersionRequest'
      responses:
        '200':
          description: Version created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
  /sales-network/distribution-agreements/{agreementId}/activate:
    post:
      summary: Activate a distribution agreement
      operationId: activateDistributionAgreement
      parameters:
        - name: agreementId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Agreement activated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
  /sales-network/distribution-agreements/{agreementId}/terminate:
    post:
      summary: Terminate a distribution agreement
      operationId: terminateDistributionAgreement
      parameters:
        - name: agreementId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Agreement terminated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
  /sales-network/distribution-agreements/{agreementId}/eligibility:
    get:
      summary: Check agreement eligibility for a line of business and risk amount
      operationId: checkAgreementEligibility
      parameters:
        - name: agreementId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: lineOfBusiness
          in: query
          schema: { type: string }
        - name: riskAmount
          in: query
          schema: { type: string, description: "Risk amount in minor units" }
      responses:
        '200':
          description: Eligibility result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
  /sales-network/distribution-agreements/{agreementId}/submit-for-approval:
    post:
      summary: Submit agreement for approval
      operationId: submitAgreementForApproval
      parameters:
        - name: agreementId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object }
      responses:
        '200':
          description: Agreement submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
  /sales-network/distribution-agreements/{agreementId}/approve:
    post:
      summary: Approve a distribution agreement
      operationId: approveDistributionAgreement
      parameters:
        - name: agreementId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, properties: { reason: { type: string } } }
      responses:
        '200':
          description: Agreement approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
  /sales-network/distribution-agreements/{agreementId}/reject:
    post:
      summary: Reject a distribution agreement
      operationId: rejectDistributionAgreement
      parameters:
        - name: agreementId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, properties: { reason: { type: string } } }
      responses:
        '200':
          description: Agreement rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
  /sales-network/distribution-agreements/{agreementId}/return:
    post:
      summary: Return a distribution agreement for revision
      operationId: returnDistributionAgreement
      parameters:
        - name: agreementId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, properties: { reason: { type: string }, conditions: { type: string } } }
      responses:
        '200':
          description: Agreement returned for revision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
  /sales-network/distribution-agreements/{agreementId}/history:
    get:
      summary: Get agreement version history
      operationId: getAgreementHistory
      parameters:
        - name: agreementId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Agreement history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
  /sales-network/distribution-agreements/{agreementId}/approvals:
    get:
      summary: Get agreement approval history
      operationId: getAgreementApprovals
      parameters:
        - name: agreementId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Approval history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
  /sales-network/distribution-agreements/{agreementId}/binding-authority:
    get:
      summary: Get binding authority profile for agreement
      operationId: getBindingAuthority
      parameters:
        - name: agreementId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Binding authority profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
  /sales-network/binding-authority-profiles:
    post:
      summary: Create a binding authority profile
      operationId: createBindingAuthorityProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BindingAuthorityProfileRequest'
      responses:
        '200':
          description: Profile created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
    get:
      summary: List binding authority profiles
      operationId: listBindingAuthorityProfiles
      responses:
        '200':
          description: List of profiles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
  /sales-network/binding-authority-profiles/{profileId}:
    get:
      summary: Get a binding authority profile by ID
      operationId: getBindingAuthorityProfile
      parameters:
        - name: profileId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Binding authority profile details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
  /sales-network/binding-authority-profiles/{profileId}/activate:
    post:
      summary: Activate a binding authority profile
      operationId: activateBindingAuthorityProfile
      parameters:
        - name: profileId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Profile activated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
  # ---- P1-1 Product Management ----
  /products:
    post:
      summary: Create a product
      operationId: createProduct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreateRequest'
      responses:
        '200':
          description: Product created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
    get:
      summary: List products with filtering and pagination
      operationId: listProducts
      parameters:
        - name: lineOfBusiness
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [draft, active, retired, archived] }
        - name: ownerOrganizationId
          in: query
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          schema: { type: integer, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: List of products
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
  /products/{productId}:
    get:
      summary: Get a product by ID
      operationId: getProduct
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Product details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
  /products/{productId}/versions:
    post:
      summary: Create a new product version
      operationId: createProductVersion
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductVersionCreateRequest'
      responses:
        '200':
          description: Version created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
    get:
      summary: List product versions
      operationId: listProductVersions
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: List of versions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
  /products/{productId}/versions/{version}:
    get:
      summary: Get a specific product version
      operationId: getProductVersion
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: version
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Product version details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
  /products/{productId}/versions/{version}/activate:
    post:
      summary: Activate a product version (supersedes previous active version)
      operationId: activateProductVersion
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: version
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, properties: { effectiveFrom: { type: string, format: date-time } } }
      responses:
        '200':
          description: Version activated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
  /products/{productId}/versions/{version}/retire:
    post:
      summary: Retire a product version
      operationId: retireProductVersion
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: version
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Version retired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
  /products/{productId}/versions/{version}/clone:
    post:
      summary: Clone a product version to create a new draft
      operationId: cloneProductVersion
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: version
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Version cloned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
  # ---- P1-2 Product Visibility ----
  /products/{productId}/visibility:
    post:
      summary: Create product visibility for a distributor
      operationId: createProductVisibility
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductVisibilityCreateRequest'
      responses:
        '200':
          description: Visibility created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
    get:
      summary: List product visibilities
      operationId: listProductVisibilities
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: List of visibilities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
  /products/{productId}/visibility/{visibilityId}:
    get:
      summary: Get a product visibility
      operationId: getProductVisibility
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: visibilityId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Visibility details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
    patch:
      summary: Update a product visibility
      operationId: updateProductVisibility
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: visibilityId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200':
          description: Visibility updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
  /products/{productId}/visibility/{visibilityId}/revoke:
    post:
      summary: Revoke a product visibility
      operationId: revokeProductVisibility
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: visibilityId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Visibility revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
  /distributors/{distributorOrganizationId}/visible-products:
    get:
      summary: List visible products for a distributor
      operationId: listDistributorVisibleProducts
      parameters:
        - name: distributorOrganizationId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: productVersion
          in: query
          schema: { type: integer }
        - name: limit
          in: query
          schema: { type: integer, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: List of visible products
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
  # ---- P1-3 Broker Product Offering ----
  /broker-offerings:
    post:
      summary: Create a broker product offering
      operationId: createBrokerProductOffering
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrokerProductOfferingCreateRequest'
      responses:
        '200':
          description: Offering created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
    get:
      summary: List broker product offerings
      operationId: listBrokerProductOfferings
      parameters:
        - name: brokerOrganizationId
          in: query
          schema: { type: string, format: uuid }
        - name: lineOfBusiness
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: List of offerings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
  /broker-offerings/{offeringId}:
    get:
      summary: Get a broker product offering
      operationId: getBrokerProductOffering
      parameters:
        - name: offeringId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Offering details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
    patch:
      summary: Update a broker product offering
      operationId: updateBrokerProductOffering
      parameters:
        - name: offeringId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200':
          description: Offering updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
  /broker-offerings/{offeringId}/activate:
    post:
      summary: Activate a broker product offering
      operationId: activateBrokerProductOffering
      parameters:
        - name: offeringId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Offering activated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
  /broker-offerings/{offeringId}/inactivate:
    post:
      summary: Inactivate a broker product offering
      operationId: inactivateBrokerProductOffering
      parameters:
        - name: offeringId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Offering inactivated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
  /customers/offerings:
    get:
      summary: List customer-facing offerings with ranking and disclosure
      operationId: listCustomerOfferings
      parameters:
        - name: brokerOrganizationId
          in: query
          schema: { type: string, format: uuid }
        - name: lineOfBusiness
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: Customer offerings with commission disclosure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
  # ---- P1-5 Catalog BFF ----
  /catalog/products:
    get:
      summary: List products via catalog BFF (view model only, no rate table)
      operationId: catalogListProducts
      parameters:
        - name: lineOfBusiness
          in: query
          schema: { type: string }
        - name: ownerOrganizationId
          in: query
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          schema: { type: integer, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: Catalog product list (view model)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
  /catalog/products/{productId}:
    get:
      summary: Get product details via catalog BFF
      operationId: catalogGetProduct
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Product view model
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
  /catalog/offerings:
    get:
      summary: List broker offerings via catalog BFF
      operationId: catalogListOfferings
      parameters:
        - name: brokerOrganizationId
          in: query
          schema: { type: string, format: uuid }
        - name: lineOfBusiness
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Catalog offerings list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
  /catalog/offerings/{offeringId}/comparison-hint:
    get:
      summary: Get offering comparison hint via catalog BFF
      operationId: catalogGetComparisonHint
      parameters:
        - name: offeringId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Comparison hint for the offering
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
  /catalog/customer-offerings:
    get:
      summary: List customer offerings via catalog BFF
      operationId: catalogListCustomerOfferings
      parameters:
        - name: brokerOrganizationId
          in: query
          schema: { type: string, format: uuid }
        - name: lineOfBusiness
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Customer catalog offerings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
  /catalog/distributors/{distributorOrganizationId}/visible-products:
    get:
      summary: List distributor visible products via catalog BFF
      operationId: catalogListDistributorVisibleProducts
      parameters:
        - name: distributorOrganizationId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: productVersion
          in: query
          schema: { type: integer }
        - name: limit
          in: query
          schema: { type: integer, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: Visible products for distributor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
  /catalog/distribution-agreements/{agreementId}/eligibility:
    get:
      summary: Check agreement eligibility via catalog BFF
      operationId: catalogCheckEligibility
      parameters:
        - name: agreementId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: lineOfBusiness
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Eligibility result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
  # ---- P0 Policy ----
  /policies/{policyId}/issue:
    post:
      summary: Issue a policy
      operationId: issuePolicy
      parameters:
        - name: policyId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyIssueRequest'
      responses:
        '200':
          description: Policy issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
components:
  schemas:
    PartyCreateRequest:
      type: object
      required: [type, fullName, nationalId]
      properties:
        type: { type: string, enum: [individual, organization] }
        fullName: { type: string }
        nationalId: { type: string }
        mobile: { type: string, nullable: true }
    DistributionAgreementCreateRequest:
      type: object
