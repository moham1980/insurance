components:
  messages:
    PolicyIssued:
      name: PolicyIssued
      contentType: application/json
      payload:
        type: object
        required: [eventType, eventVersion, correlationId, subject, payload]
        properties:
          eventType: { type: string, const: PolicyIssued }
          eventVersion: { type: integer, const: 1 }
          correlationId: { type: string }
          subject:
            type: object
            properties:
              policyId: { type: string, format: uuid }
              tenantId: { type: string }
          payload:
            type: object
            properties:
              policyId: { type: string, format: uuid }
              policyNumber: { type: string }
              tenantId: { type: string }
              status: { type: string }
              paymentId: { type: string }
